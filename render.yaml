services:
  - type: web
    name: glacierguard-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://*.pages.dev,http://localhost:5173
      - key: SATELLITE_SYNC_INTERVAL_HOURS
        value: "24"
